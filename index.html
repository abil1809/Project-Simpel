<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belajar Git | Landing Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <span class="logo">🌱 belajar-git</span>
    <button id="theme-toggle" class="btn-ghost" aria-label="Ganti tema">🌙 Tema</button>
  </header>

  <main class="hero">
    <h1>Halo, dunia <span class="accent">Git!</span></h1>
    <p class="subtitle">
      Ini project latihan pertamaku untuk belajar commit, push, dan branch.
    </p>

    <div class="actions">
      <button id="tip-btn" class="btn-primary">💡 Tips Git acak</button>
      <button id="counter-btn" class="btn-secondary">
        Kamu sudah klik: <strong id="counter">0</strong>x
      </button>
    </div>

    <p id="tip-text" class="tip-box">Klik tombol di atas untuk melihat tips pertama!</p>
  </main>

  <footer class="footer">
    <p>Dibuat dengan HTML, CSS, dan JavaScript murni. Tanpa framework.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
